services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kozmu
      POSTGRES_PASSWORD: kozmu
      POSTGRES_DB: kozmu_mester
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kozmu -d kozmu_mester"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://kozmu_app:change-me-app-role-password@postgres:5432/kozmu_mester
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://kozmu:kozmu@postgres:5432/kozmu_mester
      JWT_SECRET_KEY: local-dev-secret-change-me
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:3000"]}
      # Every invoice upload calls Claude for field extraction (not just
      # unrecognized providers) — without this, every upload fails identically.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* values are baked in at build time, so in a Codespace
        # this must be exported to the forwarded backend URL *before*
        # running `docker compose up --build` — see README for the exact
        # steps. Falls back to localhost for plain local dev.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
