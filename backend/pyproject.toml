[project]
name = "kozmu-mester-backend"
version = "0.1.0"
description = "Közmű Mester — közüzemi számla-feldolgozó SaaS backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's `Depends(...)` as a default argument is idiomatic, not a bug
    "UP042", # `class X(str, Enum)` is kept for JSON-serialization ergonomics over StrEnum
]
