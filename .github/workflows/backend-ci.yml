name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kozmu
          POSTGRES_PASSWORD: kozmu
          POSTGRES_DB: kozmu_mester_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kozmu -d kozmu_mester_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_ADMIN_DATABASE_URL: postgresql+psycopg://kozmu:kozmu@localhost:5432/kozmu_mester_test
      TEST_APP_DATABASE_URL: postgresql+psycopg://kozmu_app:change-me-app-role-password@localhost:5432/kozmu_mester_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v
